w{grid-template-columns:minmax(0,1fr)}.stage{height:340px}.lane{grid-template-columns:80px 1fr}.lane .st{grid-column:1/-1;text-align:left;display:flex;gap:14px;flex-wrap:wrap}.sp{display:none}}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n  <h1>Sorting Lab<\/h1>\n  <p class=\"sub\">A shelf of blocks puts itself in order. Watch how.<\/p>\n  <section class=\"board\">\n    <div class=\"top\">\n      <div class=\"tabs\" id=\"tabs\" role=\"tablist\"><\/div>\n      <div class=\"hint\" id=\"hint\"><\/div>\n    <\/div>\n    <div class=\"stage\" id=\"stage\"><\/div>\n    <div class=\"say\" id=\"say\"><\/div>\n    <div class=\"prog\"><i id=\"prog\"><\/i><\/div>\n    <div class=\"dock\">\n      <button class=\"ib\" id=\"back\" aria-label=\"Back\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 5h2.5v14H6zM20 5v14L9.5 12z\"/><\/svg><\/button>\n      <button class=\"ib play\" id=\"play\" aria-label=\"Play\"><\/button>\n      <button class=\"ib\" id=\"next\" aria-label=\"Next\"><svg viewBox=\"0 0 24 24\"><path d=\"M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z\"/><\/svg><\/button>\n      <button class=\"ib\" id=\"reset\" aria-label=\"Reset\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 5V2L7 6.5 12 11V8a5 5 0 11-5 5H5a7 7 0 107-8z\"/><\/svg><\/button>\n      <span class=\"sp\"><\/span>\n      <label class=\"sl\">Speed <input type=\"range\" id=\"speed\" min=\"1\" max=\"10\" value=\"6\"><\/label>\n      <label class=\"sl\">Blocks <input type=\"range\" id=\"size\" min=\"5\" max=\"24\" value=\"10\"><\/label>\n      <input class=\"txt\" id=\"custom\" placeholder=\"Your own: 5 3 8 1\" aria-label=\"Custom array\">\n      <button class=\"pill\" id=\"shuffle\">New array<\/button>\n    <\/div>\n  <\/section>\n  <div class=\"row\">\n    <section class=\"card\">\n      <h2 id=\"fname\"><\/h2>\n      <div class=\"code\" id=\"code\"><\/div>\n    <\/section>\n    <section class=\"card\">\n      <div class=\" in=\"1\" max=\"10\" value=\"7\"><\/label>\n    <\/div>\n    <div class=\"chips\" id=\"rpick\"><\/div>\n    <p class=\"rnote\" id=\"rnote\"><\/p>\n    <input class=\"scrub\" type=\"range\" id=\"rscrub\" min=\"0\" max=\"0\" value=\"0\" aria-label=\"Race position\">\n    <div id=\"lanes\"><\/div>\n    <div class=\"rverdict\" id=\"rverdict\" aria-live=\"polite\"><\/div>\n    <div class=\"sum\" id=\"rsum\"><\/div>\n  <\/section>\n<\/div>\n<script>\n(()=>{\n\"use strict\";\nconst $=s=>document.querySelector(s);\nconst SH=420,BASE=56,HMAX=210,HMIN=44,LIFT=16;\nconst reduce=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst ICON={play:'<svg viewBox=\"0 0 24 24\"><path d=\"M7 4.5v15l13-7.5z\"/><\/svg>',pause:'<svg viewBox=\"0 0 24 24\"><path d=\"M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z\"/><\/svg>'};\nconst ALGOS={\n bubble:{name:\"Bubble\",file:\"bubble_sort.py\",hint:\"Weigh neighbours. Heavier goes right.\",lab:[\"j\",\"j+1\"],code:[\n  \"def bubble_sort(a):\",\"    n = len(a)\",\"    for i in range(n - 1):\",\"        for j in range(n - 1 - i):\",\"            if a[j] > a[j + 1]:\",\"                a[j], a[j + 1] = a[j + 1], a[j]\",\"    return a\"]},\n selection:{name:\"Selection\",file:\"selection_sort.py\",hint:\"Find the lightest block. Put it first.\",lab:[\"j\",\"m\"],code:[\n  \"def selection_sort(a):\",\"    for i in range(len(a)):\",\"        m = i\",\"        for j in range(i + 1, len(a)):\",\"            if a[j] < a[m]:\",\"                m = j\",\"        a[i], a[m] = a[m], a[i]\",\"    return a\"]},\n insertion:{name:\"Insertion\",file:\"insertion_sort.py\",hint:\"Slide each block left until it fits.\",lab:[\"j-1\",\"j\"],code:[\n  \"def insertion_sort(a):\",\"    for i in range(1, len(a)):\",\"        j = i\",\"        while j > 0 and a[j - 1] > a[j]:\",\"            a[j - 1], a[j] = a[j], a[j - 1]\",\"            j -= 1\",\"    return a\"]}\n};\n/* every frame is computed before anything plays */\nfunction gen(algo,vals){\n  const n=vals.length,a=vals.map((v,id)=>({id,v})),F=[],fin=Array(n).fill(false);\n  let c=0,s=0,zn=algo===\"insertion\"?[0,0]:[0,n-1];\n  const snap=o=>F.push(Object.assign({a:a.map(x=>x.id),v:a.map(x=>x.v),fin:fin.slice(),c,s,cmp:null,swap:null,min:null,zone:zn?zn.slice():null,log:\"\"},o));\n  snap({line:1,log:\"a = [\"+vals.join(\", \")+\"]\"});\n  if(algo===\"bubble\"){\n    for(let i=0;i<n-1;i++){\n      zn=[0,n-1-i];\n      for(let j=0;j<n-1-i;j++){\n        c++;const gt=a[j].v>a[j+1].v;\n        snap({line:5,cmp:[j,j+1],log:`${a[j].v} > ${a[j+1].v}? ${gt?\"yes\":\"no\"}`});\n        if(gt){[a[j],a[j+1]]=[a[j+1],a[j]];s++;snap({line:6,swap:[j,j+1],log:`swap ${a[j+1].v} right`});}\n      }\n      fin[n-1-i]=true;\n      snap({line:3,log:`pass ${i+1} done: ${a[n-1-i].v} is home`});\n    }\n  }else if(algo===\"selection\"){\n    for(let i=0;i<n;i++){\n      zn=[i,n-1];let m=i;snap({line:3,min:m,log:`lightest so far: ${a[m].v}`});\n      for(let j=i+1;j<n;j++){\n        c++;const lt=a[j].v<a[m].v;\n        snap({line:5,cmp:[j,m],min:m,log:`${a[j].v} < ${a[m].v}? ${lt?\"yes\":\"no\"}`});\n        if(lt){m=j;snap({line:6,min:m,log:`new lightest: ${a[m].v}`});}\n      }\n      const sw=m!==i;if(sw){[a[i],a[m]]=[a[m],a[i]];s++;}\n      fin[i]=true;\n      snap({line:7,swap:sw?[i,m]:null,log:sw?`${a[i].v} jumps to the front`:`${a[i].v} already home`});\n    }\n  }else{\n    for(let i=1;i<n;i++){\n      zn=[0,i];let j=i;snap({line:3,log:`slide ${a[i].v} into the sorted side`});\n      while(j>0){\n        c++;const gt=a[j-1].v>a[j].v;\n        snap({line:4,cmp:[j-1,j],log:`${a[j-1].v} > ${a[j].v}? ${gt?\"yes\":\"no\"}`});\n        if(!gt)break;\n        [a[j-1],a[j]]=[a[j],a[j-1]];s++;j--;\n        snap({line:5,swap:[j,j+1],log:\"swap left\"});\n      }\n    }\n  }\n  fin.fill(true);zn=null;\n  snap({line:algo===\"selection\"?8:7,final:true,log:\"sorted\"});\n  return F;\n}\n/* ---------- state ---------- */\nlet algo=\"bubble\",vals=[],FR={},frames=[],cur=0,timer=null,playing=false,els=[],slot=40,hOf=[],posOf=[],shown={c:0,s:0};\nconst delay=()=>1060-(+$(\"#speed\").value)*100;\nconst dur=()=>Math.min(delay()*.8,420);\nconst hue=v=>{const mn=Math.min(...vals),mx=Math.max(...vals);return 18+((v-mn)/((mx-mn)||1))*270;};\nfunction sample(n){const p=new Set();while(p.size<n)p.add(10+Math.floor(Math.random()*90));return[...p].sort(()=>Math.random()-.5);}\n/* starting orders for the main shelf and the race */\nfunction makeData(kind,n){\n  if(kind===\"random\")return sample(n);\n  const s=sample(n).sort((a,b)=>a-b);\n  if(kind===\"reversed\")return s.reverse();\n  if(kind===\"nearly\"){\n    const k=Math.max(1,Math.round(n/6));\n    for(let t=0;t<k;t++){const i=Math.min(n-2,Math.floor((t+Math.random()*.5)*(n-1)/k));[s[i],s[i+1]]=[s[i+1],s[i]];}\n    return s;\n  }\n  return s;\n}\nconst hl=s=>s.replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\")\n  .replace(/\\b(def|for|in|if|while|and|return)\\b/g,\"<i class=k>$1<\/i>\").replace(/\\b(range|len)\\b/g,\"<i class=f>$1<\/i>\").replace(/\\b(\\d+)\\b/g,\"<i class=n>$1<\/i>\");\n/* ---------- build ---------- */\nfunction buildStage(drop){\n  const st=$(\"#stage\");st.innerHTML=\"\";\n  const n=vals.length,W=st.clientWidth;slot=W/n;st.classList.toggle(\"tiny\",slot<30);\n  const mx=Math.max(...vals);hOf=vals.map(v=>HMIN+v/mx*(HMAX-HMIN));\n  st.insertAdjacentHTML(\"beforeend\",`<div class=\"band\" id=\"band\"><\/div>\n   <div class=\"scale\" id=\"scale\"><div class=\"beam\" id=\"beam\"><\/div><div class=\"hang\" id=\"hL\"><\/div><div class=\"hang\" id=\"hR\"><\/div><div class=\"pivot\"><\/div><\/div>\n   <div class=\"shelf\"><\/div><div class=\"lamps\" id=\"lamps\"><\/div><div class=\"pin\" id=\"pin\">min<\/div>`);\n  const gap=Math.min(7,slot*.16);\n  els=vals.map((v,id)=>{\n    const d=document.createElement(\"div\");d.className=\"blk\";\n    d.style.cssText=`width:${slot-gap}px;height:${hOf[id]}px;margin-left:${gap/2}px`;\n    d.innerHTML=`<div class=\"in\" style=\"background:hsl(${hue(v)} ing:\"ease-in-out\"});\n    });\n    const xs=moved.map(m=>(m.to+.5)*slot),mid=(Math.min(...xs)+Math.max(...xs))/2,r=document.createElement(\"div\");\n    r.className=\"ring\";r.style.left=mid+\"px\";r.style.top=(SH-BASE-60)+\"px\";$(\"#stage\").appendChild(r);setTimeout(()=>r.remove(),700);\n  }\n  f.a.forEach(id=>posOf[id]=f.a.indexOf(id));\n  f.a.forEach((id,p)=>{\n    let c=\"blk\";\n    if(f.cmp&&f.cmp.includes(p))c+=\" cmp\";\n    if(f.swap&&f.swap.includes(p))c+=\" swp\";\n    if(f.zone&&(p<f.zone[0]||p>f.zone[1])&&!f.fin[p])c+=\" dim\";\n    els[id].className=c;\n  });\n  /* band: the part still being worked on */\n  const band=$(\"#band\");\n  if(f.zone){band.style.opacity=1;band.style.left=f.zone[0]*slot+\"px\";band.style.width=(f.zone[1]-f.zone[0]+1)*slot+\"px\";}else band.style.opacity=0;\n  /* lamps */\n  document.querySelectorAll(\".lamp\").forEach((l,p)=>{l.classList.toggle(\"on\",f.fin[p]);l.style.transitionDelay=f.final&&anim?p*45+\"ms\":\"0ms\";l.firstChild.style.transitionDelay=l.style.transitionDelay;});\n  /* the balance */\n  const sc=$(\"#scale\");\n  if(f.cmp){\n    const [p1,p2]=f.cmp[0]<f.cmp[1]?[f.cmp[0],f.cmp[1]]:[f.cmp[1],f.cmp[0]];\n    const id1=f.a[p1],id2=f.a[p2],x1=(p1+.5)*slot,x2=(p2+.5)*slot,hh=(x2-x1)/2,cx=(x1+x2)/2;\n    const t1=SH-BASE-hOf[id1]-LIFT,t2=SH-BASE-hOf[id2]-LIFT,by=Math.min(t1,t2)-70;\n    const d=Math.min(15,hh*.24),th=Math.asin(d/hh),leftHeavy=f.v[p1]>f.v[p2],ang=(leftHeavy?-1:1)*th,deg=ang*180/Math.PI;\n    sc.style.transform=`translate(${cx}px,${by}px) rotate(${deg}deg)`;sc.classList.add(\"on\");\n    const bm=$(\"#beam\"),hl_=hh+slot*.3;bm.style.width=hl_*2+\"px\";bm.style.left=-hl_+\"px\";\n    const eL=by+(leftHeavy?d:-d),eR=by+(leftHeavy?-d:d);\n    [[$(\"#hL\"),-hh,t1-eL],[$(\"#hR\"),hh,t2-eR]].forEach(([h,x,len])=>{h.style.left=x+\"px\";h.style.height=Math.max(10,len-8)+\"px\";h.style.transform=`rotate(${-deg}deg)`;});\n  }else sc.classList.remove(\"on\");\n  /* selection's \"lightest so far\" flag */\n  const pin=$(\"#pin\");\n  if(f.min!=null){pin.classList.add(\"on\");pin.style.transform=`translateX(${(f.min+.5)*slot-22}px)`;}else pin.classList.remove(\"on\");\n  /* code, counters, log */\n  $(\"#hl\").style.transform=`translateY(${(f.line-1)*26}px)`;\n  bump($(\"#sc\"),f.c,\"c\");bump($(\"#ss\"),f.s,\"s\");$(\"#st\").textContent=`${cur}/${frames.length-1}`;\n  $(\"#prog\").style.width=cur/(frames.length-1)*100+\"%\";\n  $(\"#say\").innerHTML=f.final?`Sorted. <em>${f.c}<\/em> comparisons, <em>${f.s}<\/em> swaps.`:cur===0?\"Press play, or step with Next.\":`<em>${f.log}<\/em>`;\n  const lg=frames.slice(Math.max(0,cur-4),cur+1).map(x=>`<div class=\"lg\">${x.log}<\/div>`).join(\"\");\n  $(\"#out\").innerHTML=`<div class=\"ar\">a = [${f.v.join(\", \")}]<\/div>${lg}${f.final?`<div class=\"ok\">print(a)  # sorted<\/div>`:\"\"}`;\n  $(\"#back\").disabled=cur===0;$(\"#next\").disabled=cur===frames.length-1;\n  $(\"#play\").innerHTML=playing?ICON.pause:ICON.play;\n  /* finish: a wave across the shelf */\n  if(f.final&&anim&&!reduce)f.a.forEach((id,p)=>els[id].firstChild.animate([{transform:\"translateY(0)\"},{transform:\"translateY(-30px)\"},{transform:\"translateY(0)\"}],{duration:520,delay:p*45,easing:\"ease-in-out\"}));\n}\n/* ---------- controls ---------- */\nfunction stop(){playing=false;clearTimeout(timer);$(\"#play\").innerHTML=ICON.play;}\nfunction tick(){if(!playing)return;if(cur>=frames.length-1){stop();return;}cur++;render(true);if(cur>=frames.length-1){stop();return;}timer=setTimeout(tick,delay());}\nfunction play(){\n  if(playing){stop();return;}\n  if(cur>=frames.length-1){cur=0;render(false);}\n  playing=true;$(\"#play\").innerHTML=ICON.pause;timer=setTimeout(tick,120);\n}\nfunction setVals(v,drop){stop();vals=v;buildStage(drop);buildAll();render(false);lanes();}\nfunction fresh(){\n  const sel=$(\"#rdata\");\n  if(sel.value===\"custom\")sel.value=\"random\";\n  setVals(makeData(sel.value,+$(\"#size\").value),true);\n}\nfunction pick(k){stop();algo=k;frames=FR[k];cur=0;buildCode();buildStage(false);render(false);}\n$(\"#next\").onclick=()=>{stop();if(cur<frames.length-1){cur++;render(true);}};\n$(\"#back\").onclick=()=>{stop();if(cur>0){cur--;render(true);}};\n$(\"#play\").onclick=play;\n$(\"#reset\").onclick=()=>{stop();cur=0;buildStage(false);render(false);};\n$(\"#shuffle\").onclick=fresh;\n$(\"#size\").oninput=fresh;\n$(\"#custom\").addEventListener(\"keydown\",e=>{\n  if(e.key!==\"Enter\")return;\n  const a=e.target.value.split(/[\\s,]+/).filter(Boolean).map(Number);\n  if(a.length<3||a.length>24||a.some(x=>!(x>=1&&x<=99))||new Set(a).size!==a.length){e.target.classList.remove(\"shake\");void e.target.offsetWidth;e.target.classList.add(\"shake\");return;}\n  $(\"#size\").value=a.length;$(\"#rdata\").value=\"custom\";setVals(a,true);\n});\n$(\"#tabs\").innerHTML=Object.keys(ALGOS).map(k=>`<button role=\"tab\" data-k=\"${k}\">${ALGOS[k].name}<\/button>`).join(\"\");\n$(\"#tabs\").onclick=e=>{const b=e.target.closest(\"button\");if(b&&b.dataset.k!==algo)pick(b.dataset.k);};\ndocument.addEventListener(\"keydown\",e=>{\n  if(/INPUT|BUTTON|SELECT/.test(e.target.tagName))return;\n  if(e.key===\"ArrowRight\")$(\"#next\").click();else if(e.key===\"ArrowLeft\")$(\"#back\").click();\n  else if(e.key===\" \"){e.preventDefault();play();}\n});\nlet rz;addEventListener(\"resize\",()=>{clearTimeout(rz);rz=setTimeout(()=>{buildStage(false);render(false);},150);});\n/* ---------- race ---------- */\n/* One shared clock. Each method sits at the last frame whose count is still within the clock. */\nconst MET={\n  step:{unit:\"steps\",note:\"Every animation step takes one tick for every method, so the lanes show the raw length of each method's work.\"},\n  cmp:{unit:\"comparisons\",note:\"The clock ticks once per comparison. A method that compares less finishes sooner, no matter how many swaps it does.\"},\n  swp:{unit:\"swaps\",note:\"The clock ticks once per swap. Moving blocks is the costly part here, so methods that move less win.\"}\n};\nconst mval={step:(F,i)=>i,cmp:(F,i)=>F[i].c,swp:(F,i)=>F[i].s};\nconst SPEEDS=[900,620,430,300,220,160,120,80,55,35];\nconst ORD=[\"1st\",\"2nd\",\"3rd\"];\nlet rt=null,T=0,metric=\"step\";\nconst on={bubble:true,selection:true,insertion:true};\nconst active=()=>Object.keys(ALGOS).filter(k=>on[k]);\nconst total=k=>{const F=FR[k];return mval[metric](F,F.length-1);};\nconst maxT=()=>Math.max(0,...active().map(total));\nconst at=(F,t)=>{const m=mval[metric];let i=F.length-1;while(i>0&&m(F,i)>t)i--;return i;};\nconst rdelay=()=>SPEEDS[+$(\"#rspeed\").value-1];\nfunction rstop(){clearInterval(rt);rt=null;$(\"#rplay\").innerHTML=ICON.play;$(\"#rplay\").setAttribute(\"aria-label\",\"Start race\");}\nfunction rstart(){\n  rstop();\n  if(T>=maxT())T=0;\n  $(\"#rplay\").innerHTML=ICON.pause;$(\"#rplay\").setAttribute(\"aria-label\",\"Pause race\");\n  rt=setInterval(()=>{T++;paintLanes();if(T>=maxT())rstop();},rdelay());\n  paintLanes();\n}\nfunction lanes(){\n  rstop();T=0;\n  $(\"#rpick\").innerHTML=`<span>Racers:<\/span>`+Object.keys(ALGOS).map(k=>`<button class=\"chip\" data-k=\"${k}\" aria-pressed=\"${on[k]}\">${ALGOS[k].name}<\/button>`).join(\"\");\n  $(\"#lanes\").innerHTML=active().map(k=>`<div class=\"lane\" data-k=\"${k}\"><div class=\"who\"><button class=\"nm\" title=\"Watch ${ALGOS[k].name} on the shelf above\">${ALGOS[k].name}<\/button><span class=\"rk\"><\/span><\/div><div><div class=\"cells\">${vals.map(()=>\"<i><\/i>\").join(\"\")}<\/div><div class=\"lbar\"><i><\/i><\/div><div class=\"now\"><\/div><\/div><div class=\"st\"><\/div><\/div>`).join(\"\");\n  paintLanes();\n}\nfunction sumHTML(){\n  const act=active(),cols=[[\"Steps\",k=>FR[k].length-1],[\"Comparisons\",k=>FR[k][FR[k].length-1].c],[\"Swaps\",k=>FR[k][FR[k].length-1].s]];\n  const best=cols.map(([,g])=>Math.min(...act.map(g)));\n  return `<div class=\"h\">Totals for this array<\/div>`+cols.map(([n])=>`<div class=\"h\">${n}<\/div>`).join(\"\")+\n    act.map(k=>`<div class=\"nmc\">${ALGOS[k].name}<\/div>`+cols.map(([,g],c)=>{const v=g(k);return `<div class=\"${act.length>1&&v===best[c]?\"best\":\"\"}\">${v}<\/div>`;}).join(\"\")).join(\"\");\n}\nfunction paintLanes(){\n  const act=active(),mx=maxT(),m=mval[metric];\n  T=Math.min(T,mx);\n  let allDone=true;\n  document.querySelectorAll(\".lane\").forEach(L=>{\n    const k=L.dataset.k,F=FR[k],i=at(F,T),f=F[i],tot=total(k),done=T>=tot;\n    if(!done)allDone=false;\n    L.querySelectorAll(\".cells i\").forEach((c,p)=>{c.style.background=`hsl(${hue(f.v[p])} 72% 64%)`;c.classList.toggle(\"c\",!!(f.cmp&&f.cmp.includes(p)));c.classList.toggle(\"f\",!!f.fin[p]);});\n    const rank=1+act.filter(j=>total(j)<tot).length;\n    L.classList.toggle(\"done\",done);\n    L.classList.toggle(\"first\",done&&rank===1&&act.length>1);\n    const rk=L.querySelector(\".rk\");rk.textContent=ORD[rank-1]||rank+\"th\";rk.style.visibility=done?\"visible\":\"hidden\";\n    L.querySelector(\".lbar i\").style.width=(done||!tot?100:Math.min(100,m(F,i)/tot*100))+\"%\";\n    L.querySelector(\".now\").textContent=done?\"Sorted.\":i===0?\"At the start line.\":f.log;\n    L.querySelector(\".st\").innerHTML=`<div>${f.c} comparisons<\/div><div>${f.s} swaps<\/div><div>step ${i}/${F.length-1}${done?\" <b>done<\/b>\":\"\"}<\/div>`;\n  });\n  $(\"#rclock\").textContent=`${MET[metric].unit}: ${T} / ${mx}`;\n  $(\"#rnote\").textContent=MET[metric].note;\n  const sc=$(\"#rscrub\");sc.max=mx;sc.value=T;\n  $(\"#rback\").disabled=T<=0;$(\"#rnext\").disabled=T>=mx;\n  if(!rt)$(\"#rplay\").innerHTML=ICON.play;\n  const v=$(\"#rverdict\");\n  if(allDone&&act.length>1){\n    const tt=act.map(total),lo=Math.min(...tt),hi=Math.max(...tt);\n    const names=x=>act.filter(k=>total(k)===x).map(k=>ALGOS[k].name).join(\" and \");\n    v.textContent=lo===hi?`All tied at ${lo} ${MET[metric].unit}.`:`Fewest ${MET[metric].unit}: ${names(lo)} (${lo}). Most: ${names(hi)} (${hi}).`;\n  }else v.textContent=\"\";\n  $(\"#rsum\").innerHTML=sumHTML();\n}\n$(\"#rplay\").onclick=()=>{if(rt)rstop();else rstart();};\n$(\"#rnext\").onclick=()=>{rstop();T=Math.min(maxT(),T+1);paintLanes();};\n$(\"#rback\").onclick=()=>{rstop();T=Math.max(0,T-1);paintLanes();};\n$(\"#rreset\").onclick=()=>{rstop();T=0;paintLanes();};\n$(\"#rscrub\").oninput=e=>{rstop();T=+e.target.value;paintLanes();};\n$(\"#rmetric\").onchange=e=>{metric=e.target.value;rstop();T=0;paintLanes();};\n$(\"#rspeed\").oninput=()=>{if(rt)rstart();};\n$(\"#rdata\").onchange=fresh;\n$(\"#rpick\").onclick=e=>{\n  const b=e.target.closest(\".chip\");if(!b)return;\n  const k=b.dataset.k;\n  if(on[k]&&active().length===1)return;\n  on[k]=!on[k];lanes();\n};\n$(\"#lanes\").onclick=e=>{\n  const l=e.target.closest(\".nm\");if(!l)return;\n  pick(l.closest(\".lane\").dataset.k);\n  $(\".board\").scrollIntoView({behavior:reduce?\"auto\":\"smooth\",block:\"start\"});\n};\nbuildCode();\nsetVals(sample(10),true);\n})();\n<\/script>\n<\/body>\n<\/html>\n"},
 {id:"syntax",label:"Syntax Error Detective",blurb:"Fix Python errors by dragging pieces",accent:"#FFD23F",html:"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Syntax Error Detective<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=Fira+Code:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#F3F7FA; --ink:#0B1F33; --mute:#5A6B7C; --card:#fff;\n  --yel:#FFD23F; --cor:#FF8A7A; --mint:#5EE0B5; --sky:#6CB6FF; --lil:#C9B6FF;\n  --red:#E5484D; --redbg:#FFE1DD; --grn:#12805C; --grnbg:#D3F6E6;\n  --ui:\"Schibsted Grotesk\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"Fira Code\",Consolas,Menlo,monospace;\n}\n*{box-sizing:border-box}\nbody{margin:0;color:var(--ink);font:16px/1.5 var(--ui);background-color:var(--bg);\n  background-image:linear-gradient(#DCE6EE 1px,transparent 1px),linear-gradient(90deg,#DCE6EE 1px,transparent 1px);background-size:30px 30px}\n.page{max-width:1180px;margin:0 auto;padding:34px 18px 70px}\nh1{margin:0;font-size:clamp(34px,6vw,62px);font-weight:800;letter-spacing:-.04em;line-height:1}\n.sub{margin:8px 0 22px;font-size:18px;color:var(--mute)}\n:focus-visible{outline:3px solid var(--sky);outline-offset:2px}\nbutton{font-family:inherit}\n/* level stepper */\n.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}\n.lv{font:700 14px var(--ui);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:.15s}\n.lv:hover{transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}\n.lv[aria-current=true]{background:var(--ink);color:#fff}\n.lv i{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:10px;line-height:1}\n.lv.done i{background:var(--mint);border-color:var(--ink);color:var(--ink)}\n.cnt{margin-left:auto;font:700 14px var(--mono);background:var(--yel);border:2.5px solid var(--ink);border-radius:99px;padding:5px 14px}\n.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}\n.card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);padding:20px;position:relative}\n.card.win{animation:win .8s}\n@keyframes win{0%{box-shadow:8px 8px 0 var(--ink)}30%{box-shadow:8px 8px 0 var(--grn),0 0 0 6px var(--mint)}100%{box-shadow:8px 8px 0 var(--ink)}}\n.goal{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}\n.goal h2{margin:0;font-size:22px;letter-spacing:-.02em}\n.goal span{font:500 14px var(--mono);background:var(--yel);border:2px solid var(--ink);border-radius:8px;padding:3px 10px}\n.clue{display:flex;gap:10px;align-items:center;border:2.5px solid var(--ink);border-radius:10px;padding:8px 12px;font:500 14px var(--mono);margin-bottom:12px;transition:background .3s}\n.clue::before{content:\"\";width:12px;height:12px;border-radius:50%;background:var(--red);flex:none}\n.clue.err{background:var(--redbg)}\n.clue.ok{background:var(--grnbg)}.clue.ok::before{background:var(--grn)}\n.clue.flip{animation:flip .4s}\n@keyframes flip{from{transform:translateY(-6px);opacity:.3}}\n/* code editor */\n.code{background:#FBFDFF;border:2.5px solid var(--ink);border-radius:10px;padding:8px 0;font:500 17px var(--mono);overflow-x:auto}\n.cl{display:flex;align-items:center;min-height:50px;white-space:pre;border-left:4px solid transparent;padding-right:14px;transition:background .2s}\n.cl em{font-style:normal;width:36px;text-align:right;padding-right:12px;color:#9AA9B8;flex:none;user-select:none;font-size:14px}\n.cl .mk{width:22px;flex:none;font:800 14px var(--ui);text-align:center}\n.cl .tx{flex:1}\n.cm{color:#7A8B9B;font-style:italic}.st{color:#0A7A55}.kw{color:#1B5FD1;font-weight:600}.bi{color:#0E7090}.nm{color:#B54708}\n.cl.on{background:#DCEBFF;border-left-color:var(--sky)}\n.cl.ok .mk{color:var(--grn)}\n.cl.bad{background:var(--redbg);border-left-color:var(--red);animation:shake .45s}\n.cl.bad .mk{color:var(--red)}\n.cl.lint .tx{text-decoration:underline wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:6px}\n@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}\n/* gaps and tiles */\n.gap{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:36px;margin:0 3px;padding:0;background:transparent;border:2.5px dashed var(--ink);border-radius:9px;cursor:pointer;vertical-align:middle;transition:transform .15s,background .15s}\n.gap:empty{animation:march 1.4s linear infinite;background-image:linear-gradient(90deg,transparent 50%,rgba(255,210,63,.35) 50%);background-size:12px 100%}\n@keyframes march{to{background-position:12px 0}}\n.gap.fill{border:0;min-width:0;height:auto;margin:0 2px;animation:none;background:none}\nbody.dragging .gap:not(.fill),body.sel .gap:not(.fill){background:#FFF3B8;animation:throb .7s ease-in-out infinite}\n@keyframes throb{50%{transform:scale(1.1)}}\n.gap.over{background:var(--yel)!important;transform:scale(1.2)!important;animation:none!important}\n.gap.bad{animation:shake .4s!important;border-color:var(--red)}\n.gap.hint::after{content:\"\\25BC\";position:absolute;margin-top:-52px;font-size:20px;color:var(--red);animation:bob .7s ease-in-out infinite}\n@keyframes bob{50%{transform:translateY(8px)}}\n.tile{display:inline-flex;align-items:center;gap:6px;font:600 17px var(--mono);padding:6px 13px;border:2.5px solid var(--ink);border-radius:9px;box-shadow:3px 3px 0 var(--ink);cursor:grab;user-select:none;touch-action:none;color:var(--ink);transition:transform .15s,box-shadow .15s;position:relative}\n.tile:hover{transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--ink)}\n.tile.p{background:var(--yel)}.tile.b{background:var(--cor)}.tile.q{background:var(--mint)}.tile.i{background:var(--sky)}.tile.n{background:var(--lil)}\n.tile.sel{outline:3px solid var(--ink);outline-offset:3px}\n.tile.ghost{opacity:.25}\n.tile.drag{position:fixed;z-index:99;pointer-events:none;box-shadow:8px 10px 0 rgba(11,31,51,.9);cursor:grabbing;transition:none}\n.tile.in{box-shadow:none;padding:3px 10px;cursor:default}\n.tile.in:hover{transform:none;box-shadow:none}\n.tile.wrong{background:var(--redbg);animation:shake .5s}\n.pop .tile{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}\n@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}\n.tile.hint{animation:wob .5s ease-in-out infinite}\n@keyframes wob{50%{transform:rotate(-5deg) scale(1.08)}}\n.coach{margin:12px 0 0;min-height:27px;font-weight:700}\n.coach.bad{color:var(--red)}.coach.good{color:var(--grn)}\n.trayw{margin-top:12px;padding:14px;border:2.5px dashed var(--ink);border-radius:12px;background:#fff}\n.trayw small{display:block;color:var(--mute);margin-bottom:10px;font-weight:600}\n.tray{display:flex;gap:12px;flex-wrap:wrap;min-height:46px}\n.empty{color:var(--mute)}\n/* controls */\n.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}\n.btn{font:700 15px var(--ui);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:9px 18px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:.12s}\n.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}\n.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.pri{background:var(--yel)}\n.btn.go{background:var(--mint);animation:nudge 1s ease-in-out infinite}\n@keyframes nudge{50%{transform:translateY(-3px)}}\n.sl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-left:auto}\n.sl input{accent-color:var(--ink);width:100px}\n/* console */\n.con{background:var(--ink);color:#D5E1EE;border-radius:10px;padding:14px 16px;font:500 14px/1.7 var(--mono);min-height:250px;white-space:pre-wrap;overflow-x:auto;border:2.5px solid var(--ink)}\n.con .p{color:#5EE0B5}.con .e{color:#FF9B91}.con .d{color:#8FA3B8}.con .o{color:#fff;animation:slide .3s}\n@keyframes slide{from{opacity:0;transform:translateX(-8px)}}\n.cur{display:inline-block;width:8px;height:15px;background:#D5E1EE;vertical-align:-2px;animation:blink 1s steps(1) infinite}\n@keyframes blink{50%{opacity:0}}\n.stage{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin:0 0 10px;font-weight:600}\n.stage::before{content:\"\";width:10px;height:10px;border-radius:50%;background:#B7C3CF}\n.stage.run::before{background:var(--sky);animation:blink 1s infinite}.stage.err::before{background:var(--red)}.stage.fin::before{background:var(--grn)}\n.want{margin-top:14px;font:500 14px var(--mono)}\n.want b{display:block;font:700 14px var(--ui);margin-bottom:6px}\n.want div{background:var(--yel);border:2px solid var(--ink);border-radius:8px;padding:4px 12px;display:inline-block;margin:0 6px 6px 0}\n.done{margin-top:22px;display:none}\n.done.show{display:block;animation:pop .5s}\n.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}\n.rules div{border:2.5px solid var(--ink);border-radius:10px;padding:10px 12px;font-weight:600}\n.rules .tile{margin-bottom:8px;cursor:default}\n.conf{position:fixed;width:10px;height:14px;z-index:200;pointer-events:none;border:1.5px solid var(--ink)}\n@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.sl{margin-left:0}.cnt{margin-left:0}}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n  <h1>Syntax Error Detective<\/h1>\n  <p class=\"sub\">Drag t ;steps=[];cur=-1;}\nfunction place(id,key,clone,src,r0){\n  const P=PZ[pi],g=P.gaps[key],gapEl=document.querySelector(`.gap[data-g=\"${key}\"]`);\n  const gr=gapEl.getBoundingClientRect();\n  if(id===g.ans){\n    const commit=()=>{\n      resetRun();S.fill[key]=id;S.tray=S.tray.filter(x=>x!==id);just=key;sel=null;document.body.classList.remove(\"sel\");\n      coach(g.ok,\"good\");\n      const done=!missing();\n      if(done){solved.add(pi);coach(\"Solved. Press Run to watch it work.\",\"good\");}\n      render();\n      if(done){\n        const b=$(\"#board\");b.classList.remove(\"win\");void b.offsetWidth;b.classList.add(\"win\");\n        const r=document.querySelector(`.gap[data-g=\"${key}\"]`).getBoundingClientRect();burst(r.left+r.width/2,r.top);\n        if(solved.size===PZ.length)$(\"#done\").classList.add(\"show\");\n      }\n    };\n    if(clone){\n      const tx=gr.left+gr.width/2-(r0.left+r0.width/2),ty=gr.top+gr.height/2-(r0.top+r0.height/2);\n      clone.animate([{transform:clone.style.transform},{transform:`translate(${tx}px,${ty}px) scale(.8)`,opacity:.2}],{duration:D_(170),easing:\"ease-in\",fill:\"forwards\"}).onfinish=()=>{clone.remove();commit();};\n    }else commit();\n  }else{\n    coach(g.why[id]||\"That piece does not fit here. Read the red message: what is Python asking for?\",\"bad\");\n    gapEl.classList.add(\"bad\");setTimeout(()=>gapEl.classList.remove(\"bad\"),450);\n    if(clone)flyBack(clone,src,r0);\n    sel=null;document.body.classList.remove(\"sel\");\n    document.querySelectorAll(\".tile.sel\").forEach(t=>t.classList.remove(\"sel\"));\n  }\n}\nfunction flyBack(clone,src,r0){\n  const sr=src.getBoundingClientRect(),tx=sr.left-r0.left,ty=sr.top-r0.top;\n  clone.animate([{transform:clone.style.transform},{transform:`translate(${tx}px,${ty}px)`}],{duration:D_(280),easing:\"cubic-bezier(.3,1.4,.5,1)\",fill:\"forwards\"}).onfinish=()=>{clone.remove();src.classList.remove(\"ghost\");};\n}\nfunction burst(x,y){\n  if(reduce)return;\n
